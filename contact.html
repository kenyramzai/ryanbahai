<HEAD>
  <TITLE>Ryan's Baha'i Site / Contact Form</TITLE>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <META NAME = "description" CONTENT = "Ryan's Baha'i Site. Ryan's Site about the Baha'i Faith. Contact form. Ryan Kazemi. Keny Ramzai.">

<BODY BGCOLOR="MAROON" LINK="WHITE" VLINK="WHITE" TEXT ="SILVER"><B>
  <H1>Ryan's Baha'i Site</H1>
  
<UL>
  <H2>Contact Form</H2>
  
  <form id="contactForm">
  <div>
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>
  </div>
  <div>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>
  </div>
  <div>
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" required></textarea>
  </div>
  <button type="submit">Send Message</button>
  <p id="formStatus"></p>
</form>

</UL>
